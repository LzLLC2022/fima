name: IRP Weekly Reporter

on:
  schedule:
    # 매주 금요일 UTC 07:30 (KST 16:30)에 실행
    - cron: '30 7 * * 5'
  workflow_dispatch:

jobs:
  run-weekly-reporter:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run Weekly Reporter Script
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File ./pension/scripts/weekly_reporter.ps1
