name: Holdings Report (Telegram)

on:
  schedule:
    # KST 화-토 07:00 = UTC 월-금 22:00
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      owner:
        description: '특정 Owner만 발송 (비워두면 전체)'
        required: false
        default: ''

jobs:
  send-holdings:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger holdings report
        run: |
          OWNER="${{ github.event.inputs.owner }}"
          BODY="{}"
          if [ -n "$OWNER" ]; then
            BODY="{\"owner\":\"$OWNER\"}"
          fi
          echo "=== body: $BODY ==="

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST https://fima.lim.kr/api/holdings-report \
            -H "Authorization: Bearer ${{ secrets.REPORT_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY_RESP=$(echo "$RESPONSE" | head -n -1)
          echo "HTTP Status: $HTTP_CODE"
          echo "$BODY_RESP" | python3 -m json.tool 2>/dev/null || echo "$BODY_RESP"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error: API returned $HTTP_CODE"
            exit 1
          fi
