name: IRP Daily Reporter

on:
  schedule:
    # 매일 UTC 07:00 (KST 16:00)에 실행 (월~금)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-daily-reporter:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run Daily Reporter Script
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File ./pension/scripts/daily_reporter.ps1

      - name: Commit and Push Log Changes
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pension/portfolio_daily_log.jsonl
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily portfolio log" && git push)
