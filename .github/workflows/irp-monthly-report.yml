name: IRP Monthly Reporter

on:
  schedule:
    # 매월 1일 UTC 00:00 (KST 09:00)에 실행
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  run-monthly-reporter:
    runs-on: windows-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: Run Monthly Reporter Script
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          powershell -ExecutionPolicy Bypass -File ./pension/scripts/monthly_reporter.ps1
